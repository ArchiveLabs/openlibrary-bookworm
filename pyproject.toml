[project]
name = "bookworm"
version = "0.1.0"
description = "Review and dispatch Open Library imports"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlmodel>=0.0.24,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "jsonschema>=4.23,<5",
  "fastapi-pagination[sqlmodel]>=0.16,<1",
  "sqlakeyset>=2.0.1787969905",
  "procrastinate==3.10.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLR1702"]
ignore = ["E501", "B008"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.pylint]
max-nested-blocks = 3
